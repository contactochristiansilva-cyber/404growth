<!doctype html><html lang="es"><head><meta charset="utf-8">
<!-- VSL v4 (20/11/2026). window.R(t, capa) deja la página en el segundo t.
     'front': subtítulos de todo lo que dice (lo importante con fondo blanco y letra de gris a gris oscuro),
              el recorrido del calendario de /book y la cifra «+30.000 €».
     'behind': lo que pasa por detrás de Christian (móvil con la tienda y «15 días»). -->
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;background:transparent;overflow:hidden;font-family:-apple-system,"SF Pro Display","SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#111}
.L{position:absolute;inset:0}
.hide{display:none!important}
/* ---------- subtítulos ---------- */
#sub{position:absolute;left:960px;top:930px;transform:translate(-50%,-50%);white-space:nowrap;font-size:46px;font-weight:500;letter-spacing:-.012em;line-height:1;padding:15px 30px 17px;border-radius:20px}
#sub span{margin:0 .13em}
#sub.vid{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.35)}
#sub.vid span{opacity:.5}
#sub.vid span.on{opacity:1}
#sub.lite{color:#9C9CA1;background:rgba(255,255,255,.9);box-shadow:0 2px 12px rgba(0,0,0,.05)}
#sub.lite span.on{color:#1D1D1F}
#sub.pill{background:#fff;color:#A6A6AB;font-weight:600;text-shadow:none;box-shadow:0 6px 24px rgba(0,0,0,.12)}
#sub.pill span{opacity:1}
#sub.pill span.on{color:#1D1D1F}
/* ---------- tarjetas blancas: su frase en grande, de gris a gris oscuro ---------- */
#card{position:absolute;inset:0;background:#F2F2F2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 150px}
#card .ln{display:block;max-width:1560px;text-wrap:balance}
#card .ln span{color:#D1D1D6;margin:0 .03em;display:inline-block}
#card .g{font-weight:400;font-size:62px;letter-spacing:-.015em;line-height:1.16;margin:8px 0}
#card .b{font-weight:600;font-size:116px;letter-spacing:-.032em;line-height:1.05;margin:8px 0}
#card .g span.on{color:#8E8E93}
#card .b span.on{color:#111}
#card.many .g{font-size:56px;margin:9px 0}
#card.many .b{font-size:104px;margin-top:30px}
#card .nums{display:flex;gap:36px;margin-top:54px}
#card .nums div{width:210px;height:150px;border-radius:30px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:200;font-size:92px;color:#D1D1D6}
#card .nums div.on{background:#111;color:#fff}
/* ---------- las cuentas, a un lado: lo que cuesta un local frente a la tienda online ---------- */
#side{position:absolute;left:1392px;top:540px;width:472px;background:#fff;border-radius:42px;padding:40px 42px 34px;box-shadow:0 24px 70px rgba(0,0,0,.10),0 2px 8px rgba(0,0,0,.04)}
#side .ti{font-size:24px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#86868B;margin-bottom:20px}
#side .r{padding:13px 0 15px;border-top:1px solid #EDEDF0}
#side .l{font-size:28px;font-weight:400;color:#C7C7CC;letter-spacing:-.008em;line-height:1.2}
#side .v{font-size:62px;font-weight:700;letter-spacing:-.035em;line-height:1.08;color:#D1D1D6;white-space:nowrap}
#side .v small{font-size:31px;font-weight:400;letter-spacing:-.01em;margin-left:7px}
#side .v.x{font-size:47px;letter-spacing:-.03em;line-height:1.3}
#side .r.on .l{color:#86868B}
#side .r.on .v{color:#1D1D1F}
#side.online .r.on .v.z{color:#2E7A64}
#side .tot{border-top:2px solid #1D1D1F;padding-top:18px;margin-top:4px}
#side .tot .v{font-size:86px;font-weight:800;letter-spacing:-.045em;color:#8E8E93}
#side .tot .v small{font-size:44px;font-weight:600}
#side .tot.on .v{color:#111}
/* ---------- cifra arriba, como en los ads ---------- */
#top{position:absolute;left:1230px;top:120px;width:560px;text-align:center;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25);opacity:0}
#top b{display:block;font-weight:200;font-size:112px;letter-spacing:-.03em;line-height:1}
#top i{display:block;font-style:normal;font-weight:300;font-size:34px;margin-top:6px;opacity:.9}
/* ---------- calendario de /book ---------- */
#cal{position:absolute;inset:0}
#hole{position:absolute;left:60px;top:60px;width:860px;height:960px;border-radius:40px;box-shadow:0 0 0 2400px #F2F2F2}
#bgfull{position:absolute;inset:0;background:#F2F2F2}
#phone{position:absolute;left:1219px;top:93px;width:422px;height:894px;border-radius:58px;background:#0B0D0C;padding:10px;box-shadow:0 30px 70px rgba(0,0,0,.22),0 0 0 2px #2a2d2c inset;transform:scale(1.12);transform-origin:50% 50%}
#scr{position:relative;width:402px;height:874px;border-radius:48px;overflow:hidden;background:#050706}
#scr img{position:absolute;left:0;top:0;width:402px;display:block}
#tap{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(255,255,255,.5);box-shadow:0 0 0 2px rgba(255,255,255,.95),0 0 0 3px rgba(0,0,0,.25),0 4px 14px rgba(0,0,0,.35);opacity:0}
#cta{position:absolute;left:60px;top:420px;width:1040px;text-align:center;color:#1D1D1F;line-height:1.05}
#cta b{display:block;font-weight:700;font-size:96px;letter-spacing:-.035em}
#cta i{display:block;font-style:normal;font-weight:300;font-size:44px;color:#86868B;margin-bottom:14px;letter-spacing:-.01em}
/* ---------- elementos que pasan por detrás ---------- */
.flt{position:absolute;opacity:0}
.phone{left:540px;top:120px;width:290px;height:540px;border-radius:46px;background:#fff;box-shadow:0 30px 60px rgba(0,0,0,.22);padding:22px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
.phone .bar{height:10px;width:90px;border-radius:5px;background:#E5E5EA;margin:0 auto 4px}
.phone .hero{height:200px;border-radius:24px;background:linear-gradient(160deg,#E9DCCB 0%,#C9AE8E 55%,#9C7B5C 100%);position:relative}
.phone .hero:after{content:"Nueva colección";position:absolute;left:16px;bottom:14px;color:#fff;font-weight:600;font-size:20px}
.phone .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.phone .grid div{height:96px;border-radius:16px;background:#F2F2F2}
.phone .grid div:nth-child(2){background:#E8E2DA}.phone .grid div:nth-child(3){background:#DCD5CC}
.phone .btn{margin-top:auto;height:58px;border-radius:29px;background:#111;color:#fff;font-weight:600;font-size:20px;display:flex;align-items:center;justify-content:center}
.notif{left:500px;top:62px;width:370px;padding:16px 18px;border-radius:22px;background:rgba(255,255,255,.97);box-shadow:0 18px 40px rgba(0,0,0,.18);display:flex;gap:12px;align-items:center}
.notif i{width:42px;height:42px;border-radius:11px;background:#111;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-weight:700;font-size:15px}
.notif b{display:block;font-size:20px;font-weight:600;color:#111}
.notif span{font-size:18px;color:#6E6E73}
.n15{left:900px;width:860px;top:120px;text-align:center;color:#fff;line-height:.82}
.n15 .v{font-weight:700;font-size:400px;letter-spacing:-.06em;display:block}
.n15 .l{font-weight:300;font-size:96px;letter-spacing:-.02em;display:block;margin-top:10px}
</style></head><body>
<div class="L" id="front">
  <div id="cal" class="hide"><div id="bgfull" class="hide"></div><div id="hole"></div>
    <div id="cta" class="hide"><i>Reunión gratuita · 30 min</i><b>Elige día y hora</b></div>
    <div id="phone"><div id="scr"><img id="simg" alt=""><div id="tap"></div></div></div></div>
  <div id="top"><b>+30.000 €</b><i>al mes</i></div>
  <div id="side" class="hide"></div>
  <div id="sub" class="hide"></div>
  <div id="card" class="hide"></div>
</div>
<div class="L" id="behind"></div>
<script src="spec4.js"></script>
<script>
const S=window.SPEC;
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-cl(x),3);
const eio=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const P=(t,a,d)=>cl((t-a)/d);
const $=id=>document.getElementById(id);
const F=$('front'),B=$('behind'),SUBEL=$('sub');
const inAny=(l,t)=>l.find(s=>t>=s.t0&&t<s.t1);

/* ---------- subtítulos ---------- */
let subIdx=-2;
function drawSub(t){
  const i=t<S.voice?S.sub.findIndex(s=>t>=s.t0&&t<s.t1):-1;
  if(i<0){SUBEL.classList.add('hide');subIdx=-1;return false}
  const s=S.sub[i];
  if(i!==subIdx){SUBEL.innerHTML=s.w.map(w=>`<span>${w[0].replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>`).join('');subIdx=i}
  const cut=inAny(S.cut,t),cal=inAny(S.cal,t);
  let mode='vid';
  if(cut) mode=(s.key||cut.dark)?'pill':'lite'; else if(s.key) mode='pill';
  SUBEL.className=mode;
  SUBEL.style.left=(cal?490:(cut&&inAny(S.side||[],t)?766:960))+'px';
  SUBEL.style.top=(cut?972:(cal?940:930))+'px';
  [...SUBEL.children].forEach((e,j)=>e.classList.toggle('on',t>=s.w[j][1]-0.03));
  return true;
}

/* ---------- tarjetas blancas ---------- */
const CARDEL=$('card');let cardIdx=-1;
const esc=x=>x.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function drawCard(t){
  const i=(S.card||[]).findIndex(c=>t>=c.t0&&t<c.t1);
  CARDEL.classList.toggle('hide',i<0);
  if(i<0){cardIdx=-1;return false}
  const c=S.card[i];
  if(i!==cardIdx){
    CARDEL.innerHTML=c.lines.map(l=>`<div class="ln ${l.c}">${l.w.map(w=>`<span data-t="${w[1]}">${esc(w[0])}</span>`).join(' ')}</div>`).join('')+
      (c.nums?`<div class="nums"><div data-t="${c.nums}">1</div><div>2</div><div>3</div></div>`:'');
    CARDEL.classList.toggle('many',c.lines.length>3);cardIdx=i;
  }
  CARDEL.style.transform=`translateY(${((1-eo(P(t,c.t0,0.36)))*1080).toFixed(1)}px)`;
  CARDEL.querySelectorAll('[data-t]').forEach(e=>e.classList.toggle('on',t>=+e.dataset.t-0.03));
  return true;
}

/* ---------- las cuentas, a un lado ---------- */
const SIDEEL=$('side');let sideIdx=-1;
const mil=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');
function drawSide(t){
  const i=(S.side||[]).findIndex(c=>t>=c.t0&&t<c.t1);
  SIDEEL.classList.toggle('hide',i<0);
  if(i<0){sideIdx=-1;return false}
  const c=S.side[i];
  if(i!==sideIdx){
    SIDEEL.className=c.kind;
    SIDEEL.innerHTML=`<div class="ti">${esc(c.title)}</div>`+c.rows.map(r=>`<div class="r"><div class="l">${esc(r.l)}</div><div class="v${r.x?' x':''}${r.v===0?' z':''}"></div></div>`).join('')+
      (c.total?`<div class="r tot"><div class="l">${esc(c.total.l)}</div><div class="v"></div></div>`:'');
    sideIdx=i;
  }
  const v=eo(P(t,c.t0,0.4));
  SIDEEL.style.opacity=v.toFixed(3);
  SIDEEL.style.transform=`translate(${((1-v)*70).toFixed(1)}px,-50%)`;
  const R=SIDEEL.querySelectorAll('.r');let sum=0,any=false;
  c.rows.forEach((r,j)=>{
    const on=t>=r.t,k=eo(P(t,r.t,0.45)),el=R[j].querySelector('.v');
    R[j].classList.toggle('on',on);
    let h='—';
    if(on){ if(r.x) h=esc(r.x)+(r.x2&&t>=r.t2?' · '+esc(r.x2):''); else h=mil(r.v*k)+`<small>${esc(r.u)}</small>`; }
    if(el.dataset.h!==h){el.innerHTML=h;el.dataset.h=h}
    if(on&&r.y){sum+=r.y*k;any=true}
  });
  if(c.total){
    const T=R[c.rows.length],el=T.querySelector('.v');
    T.classList.toggle('on',t>=c.total.t);
    const h=any?mil(sum)+`<small>${esc(c.total.u)}</small>`:'—';
    if(el.dataset.h!==h){el.innerHTML=h;el.dataset.h=h}
    const pop=t>=c.total.t?1+0.06*(1-eo(P(t,c.total.t,0.35))):1;
    el.style.transform=`scale(${pop.toFixed(4)})`;el.style.transformOrigin='0 60%';
  }
  return true;
}

/* ---------- calendario ---------- */
// pasos: [segundo desde el inicio, imagen, [x,y] del toque que lleva a ese paso]
const CALSEQ={
 cal1:{scroll:[0,1.7,520],steps:[[1.7,'s0'],[2.5,'s1',[201,511]],[3.4,'s2',[201,770]],[4.3,'s3',[118,627]],[5.2,'s5',[200,797]],[6.1,'s6',[200,815]]]},
 cal2:{steps:[[0,'s0'],[0.7,'s1',[201,511]],[1.5,'s2',[201,770]],[2.9,'s3',[118,627]],[3.7,'s5',[200,797]],[4.5,'s6',[200,815]],[5.3,'s7']]}
};
const IMG={};['long','s0','s1','s2','s3','s5','s6','s7'].forEach(n=>{const i=new Image();i.src='cal/'+n+'.png';IMG[n]=i});
function drawCal(c,t){
  const q=CALSEQ[c.kind],u=t-c.t0,img=$('simg'),tap=$('tap');
  const outro=t>=S.voice;
  $('bgfull').classList.toggle('hide',!outro);$('hole').classList.toggle('hide',outro);
  $('cta').classList.toggle('hide',!outro);
  let name='s0',top=0;
  if(q.scroll&&u<q.scroll[1]){name='long';top=-q.scroll[2]*eio(P(u,q.scroll[0]+0.25,q.scroll[1]-0.35))}
  else{for(const s of q.steps) if(u>=s[0]) name=s[1]}
  if(img.dataset.n!==name){img.src=IMG[name].src;img.dataset.n=name}
  img.style.top=top.toFixed(1)+'px';
  // toque: aparece 0,28 s antes del cambio y se va justo después
  let op=0,x=0,y=0,sc=1;
  for(const s of q.steps){ if(!s[2])continue; const d=s[0]-u; if(d<=0.36&&d>0){x=s[2][0];y=s[2][1];op=eo((0.36-d)/0.1);sc=d>0.12?1.3-0.3*eo((0.36-d)/0.2):0.86}}
  tap.style.opacity=op.toFixed(3);tap.style.left=x+'px';tap.style.top=y+'px';tap.style.transform=`scale(${sc.toFixed(3)})`;
}

/* ---------- elementos por detrás ---------- */
function mkFloat(s){
 const g=document.createElement('div');g.className='L';
 if(s.kind==='phone')g.innerHTML=`<div class="flt phone" data-d="0"><div class="bar"></div><div class="hero"></div><div class="grid"><div></div><div></div><div></div><div></div></div><div class="btn">Añadir a la cesta</div></div><div class="flt notif" data-d="0.9"><i>404</i><div><b>Nuevo pedido</b><span>Valencia · 64,90 €</span></div></div>`;
 if(s.kind==='n15')g.innerHTML=`<div class="flt n15" data-d="0"><span class="v">15</span><span class="l">días</span></div>`;
 return g;
}
S.float.forEach(s=>{s._g=mkFloat(s);s._g.classList.add('hide');B.appendChild(s._g)});
function drawFloat(s,t){
 s._g.querySelectorAll('.flt').forEach((el,i)=>{
  const t0=s.t0+(+el.dataset.d),v=eo(P(t,t0,0.6)),out=1-cl((t-s.t1+0.3)/0.3);
  const drift=Math.sin((t-s.t0)*1.3+i)*6,rot=s.kind==='n15'?0:(-7+Math.sin((t-s.t0)*0.8+i)*1.2);
  const sc=s.kind==='n15'?(0.94+0.06*v+0.01*(t-s.t0)):(0.96+0.04*v);
  el.style.opacity=(v*out).toFixed(3);
  el.style.transform=`translateY(${((1-v)*60+drift).toFixed(2)}px) rotate(${rot.toFixed(2)}deg) scale(${sc.toFixed(4)})`;
 });
}

window.R=function(t,layer){
 F.style.display=layer==='front'?'block':'none';B.style.display=layer==='behind'?'block':'none';
 let any=false;
 if(layer==='front'){
  const cal=inAny(S.cal,t);$('cal').classList.toggle('hide',!cal);if(cal){any=true;drawCal(cal,t)}
  const tn=inAny(S.topnum,t);$('top').style.opacity=tn?(eo(P(t,tn.t0,0.3))*(1-cl((t-tn.t1+0.25)/0.25))).toFixed(3):0;if(tn)any=true;
  if(drawSide(t))any=true;
  const cd=drawCard(t);if(cd)any=true;
  if(cd&&t>=inAny(S.card,t).t0+0.2){SUBEL.classList.add('hide')}else if(drawSub(t))any=true;
 }else{
  S.float.forEach(s=>{const on=t>=s.t0&&t<s.t1;s._g.classList.toggle('hide',!on);if(on){any=true;drawFloat(s,t)}});
 }
 return any;
};
window.READY=Promise.all(Object.values(IMG).map(i=>i.decode().catch(()=>{}))).then(()=>true);
</script></body></html>
